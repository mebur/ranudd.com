<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}
  <main class="legal-page wrap" style="--accent: {{ page.accent | default: '#7C6BFF' }};">
    <a class="legal-back" href="{{ page.back_url | default: '/' | relative_url }}">&larr; Back to {{ page.back_label | default: site.title }}</a>
    <h1>{{ page.title }}</h1>
    <article class="legal-content">
      {{ content }}
    </article>
  </main>
  {% include footer.html %}
</body>
</html>
