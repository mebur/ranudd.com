title: Ranudd
description: "Ranudd"
url: "https://ranudd.com"
author: Patrik Ranudd
contact_email: contact@ranudd.com

markdown: kramdown
sass:
  style: compressed

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

apps:
  - id: bna
    name: "Binaural AudIo"
    tagline: "Brainwave entrainment & AI soundscapes"
    accent: "#7C6BFF"
    accent_soft: "#DCE4FF"
    icon: /assets/images/bna/icon.png
    feature_graphic: /assets/images/bna/feature_graphic.png
    hero_bg: /assets/images/bna/hero-bg.jpg
    name_mono: true
    hero_pills:
      - label: "Binaural Beats (Alpha, Theta, Delta, Beta, Gamma)"
        color: "#7C6BFF"
      - label: "AI Ambient Soundscapes"
        color: "#38BDF8"
      - label: "Soundscape Library & Gentle Sleep Timer"
        color: "#A855F7"
      - label: "100% On-Device & Private"
        color: "#EC4899"
    hero_tags: "Focus  •  Deep Sleep  •  Meditation  •  Relaxation"
    description: >
      Binaural-beat audio designed to entrain brainwave activity toward a target
      mental state — focus, deep sleep, meditation, or relaxation — optionally
      layered with an AI-generated ambient soundscape, entirely on-device.
    privacy_url: /privacy.html
    terms_url: null
    screenshots:
      - src: /assets/images/bna/screen-player.jpg
        alt: "Binaural AudIo brainwave player showing the Alpha band selected"
      - src: /assets/images/bna/screen-soundscapes.jpg
        alt: "Soundscape picker with Ocean Beach, Old Clock, Submarine and AI options"
      - src: /assets/images/bna/screen-ai-generator.jpg
        alt: "AI soundscape generator with a text prompt field"

  - id: costcurrent
    name: "CostCurrent"
    tagline: "Smart European electricity monitoring"
    accent: "#10B981"
    accent_soft: "#E0F2FE"
    icon: /assets/images/costcurrent/icon.png
    feature_graphic: /assets/images/costcurrent/feature_graphic.png
    hero_bg: /assets/images/costcurrent/hero-bg.jpg
    name_mono_suffix: "Current"
    name_mono_color: "#00E5FF"
    hero_pills:
      - label: "Real-time Spot Prices (15m & 60m)"
        color: "#10B981"
      - label: "Weather, Wind & Solar Insights"
        color: "#00E5FF"
      - label: "40+ European Bidding Zones & Currencies"
        color: "#F59E0B"
      - label: "Day-Ahead Alerts & Home Screen Widgets"
        color: "#38BDF8"
    hero_tags: "Live Electricity Prices  •  Day-Ahead Forecasts  •  40+ Zones  •  Home Screen Widgets"
    description: >
      Real-time electricity spot price visualization with weather, wind and
      solar overlays for 40+ European bidding zones — so you always know when
      power is cheap.
    privacy_url: /cc-privacy.html
    terms_url: /cc-terms.html
    screenshots:
      - src: /assets/images/costcurrent/screen-dashboard.jpg
        alt: "CostCurrent dashboard showing current spot price and 12h forecast chart"
      - src: /assets/images/costcurrent/screen-settings.jpg
        alt: "Electricity market zone and chart resolution settings"
      - src: /assets/images/costcurrent/screen-alerts.jpg
        alt: "VoltWatch Pro price alert threshold settings"
